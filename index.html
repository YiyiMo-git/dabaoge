<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大宝哥智能体 · 人工智障第一品牌</title>
<style>
  :root{
    --bg: #09090b;
    --text: #fafafa;
    --muted: #a1a1aa;
    --border-glass: rgba(255, 255, 255, 0.08);
    --bg-glass: rgba(18, 18, 20, 0.6);
    --bg-glass-hover: rgba(30, 30, 33, 0.8);
    --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    --acc1: #a78bfa; /* 紫 */
    --acc2: #f472b6; /* 粉 */
    --acc-grad: linear-gradient(120deg, var(--acc1), var(--acc2));
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::selection{background:rgba(167,139,250,0.35);}

  /* ---------- 背景光球 ---------- */
  .orb{
    position: fixed; border-radius: 50%;
    filter: blur(100px); opacity: .22; z-index: 0;
    pointer-events: none;
  }
  .orb1{width:460px;height:460px;background:#7c3aed;top:-140px;left:-120px;animation:float 22s ease-in-out infinite;}
  .orb2{width:380px;height:380px;background:#db2777;bottom:-120px;right:-90px;animation:float 18s ease-in-out infinite reverse;opacity:.16;}
  .orb3{width:260px;height:260px;background:#2563eb;top:40%;left:60%;animation:float 26s ease-in-out infinite -8s;opacity:.12;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(60px,40px) scale(1.08);}
    66%{transform:translate(-40px,70px) scale(.94);}
  }

  /* ---------- 顶部栏 ---------- */
  .topbar{
    height: 56px; flex: 0 0 56px;
    border-bottom: 1px solid var(--border-glass);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    background: rgba(9, 9, 11, 0.5);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 10;
    position: relative;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;font-size:14px;}
  .logo{
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--acc-grad); color: var(--bg);
    font-weight: 800; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(167,139,250,0.45);
  }
  .brand-name{font-weight: 600; letter-spacing: .3px;}
  .brand-tag{
    font-size: 10px; padding: 2px 7px; border-radius: 99px;
    border: 1px solid rgba(167,139,250,0.4); color: var(--acc1);
    margin-left: 2px; white-space: nowrap;
  }
  .topbar-right{display:flex;align-items:center;gap:10px;}

  /* 智商余额胶囊 */
  .iq-pill{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border-glass);
    background: rgba(255,255,255,0.04);
    padding: 5px 12px; border-radius: 99px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted);
    cursor: pointer; transition: all .15s; user-select: none;
  }
  .iq-pill:hover{background:rgba(255,255,255,0.08);color:var(--text);}
  .iq-pill .iq-num{font-weight:700;font-size:13px;transition:color .3s;}
  .iq-pill.shake{animation:shake .5s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-4px)}40%{transform:translateX(4px)}
    60%{transform:translateX(-3px)}80%{transform:translateX(3px)}
  }
  .topbar-right .haushuo{
    font-size: 11px; color: var(--muted);
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  /* ---------- 聊天区 ---------- */
  .chat{flex:1;overflow-y:auto;padding:28px 22px 190px;position:relative;z-index:1;}
  .chat-inner{max-width: 800px; margin: 0 auto;}

  /* 欢迎区 */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6vh 0 34px;animation:fadeUp .6s cubic-bezier(.16,1,.3,1);}
  .hero-logo{
    width: 64px; height: 64px; border-radius: 20px;
    background: var(--acc-grad);
    font-weight: 800; font-size: 34px; color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(167,139,250,.5), 0 0 80px rgba(244,114,182,.2);
    margin-bottom: 20px;
    animation: breathe 3.5s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .hero h1{
    margin:0 0 10px;font-size:30px;font-weight:800;letter-spacing:1px;
    background: var(--acc-grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p{margin:0;color:var(--muted);font-size:13.5px;letter-spacing:.5px;}
  .hero .slogan{
    margin-top:8px;font-size:11.5px;color:#71717a;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;max-width:560px;}
  .chip{
    border:1px solid var(--border-glass);
    background: var(--bg-glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: var(--muted); font-size: 12.5px;
    padding: 9px 16px; border-radius: 99px; cursor: pointer;
    transition: all .18s; animation: fadeUp .5s cubic-bezier(.16,1,.3,1) both;
  }
  .chip:hover{color:var(--text);border-color:rgba(167,139,250,.5);transform:translateY(-2px);box-shadow:0 6px 20px rgba(167,139,250,.15);}
  .chip:nth-child(1){animation-delay:.05s}.chip:nth-child(2){animation-delay:.12s}
  .chip:nth-child(3){animation-delay:.19s}.chip:nth-child(4){animation-delay:.26s}
  .chip:nth-child(5){animation-delay:.33s}.chip:nth-child(6){animation-delay:.4s}

  .msg{display:flex;gap:12px;margin-bottom:24px;align-items:flex-start;animation:fadeUp .4s cubic-bezier(.16,1,.3,1);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .msg.user{justify-content:flex-end;}
  .msg .body{max-width:86%;min-width:0;}
  .msg.user .body{display:flex;flex-direction:column;align-items:flex-end;}

  .avatar{
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 8px;
    background: var(--acc-grad); color: var(--bg);
    font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
    box-shadow: 0 0 10px rgba(167,139,250,.3);
  }

  .meta{
    font-size: 10.5px; color: #71717a; margin-bottom: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .03em;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .meta .conf{padding:1px 7px;border-radius:99px;border:1px solid var(--border-glass);}
  .conf.hi{color:#4ade80;border-color:rgba(74,222,128,.35);}
  .conf.mid{color:#facc15;border-color:rgba(250,204,21,.3);}
  .conf.low{color:#f87171;border-color:rgba(248,113,113,.35);}

  .bubble{white-space:pre-wrap;word-break:break-word;line-height:1.68;font-size:14.5px;}

  .msg.user .bubble{
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--border-glass);
    border-radius: 16px 16px 4px 16px;
    padding: 10px 16px; color: var(--text);
  }
  .msg.ai .bubble{
    color:#e4e4e7;
    background: rgba(18,18,20,0.55);
    border: 1px solid var(--border-glass);
    border-radius: 4px 16px 16px 16px;
    padding: 10px 16px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .msg.ai .bubble .q{color:var(--acc1);}  /* 智障补充说明高亮 */

  .typing{display:flex;gap:4px;padding:8px 2px;align-items:center;}
  .typing .dots{display:flex;gap:4px;}
  .typing span{
    width:6px;height:6px;border-radius:50%;background:var(--acc1);
    opacity:.35;animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .typing .think-text{
    margin-left:10px;font-size:11.5px;color:#71717a;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- 底部控制区 ---------- */
  .bottom-wrapper{
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, transparent 0%, var(--bg) 45%);
    padding: 20px 22px 28px;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; z-index: 5;
  }
  .bottom-inner{width: 100%; max-width: 800px; position: relative; pointer-events: auto;}

  .control-panel{
    position: absolute; bottom: calc(100% + 14px); right: 0;
    background: var(--bg-glass);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-glass);
    border-radius: 16px; padding: 18px; width: 300px;
    box-shadow: var(--shadow-glass);
    display: flex; flex-direction: column; gap: 16px;
    transform: translateY(10px) scale(0.98);
    opacity: 0; visibility: hidden;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 50; transform-origin: bottom right;
  }
  .control-panel.show{transform: translateY(0) scale(1);opacity: 1;visibility: visible;}

  .panel-header{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .panel-strength-val{font-size:16px;font-weight:600;letter-spacing:2px;background:var(--acc-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

  .model-trigger-wrapper{position:relative;display:inline-block;width:100%;}
  .panel-model-trigger{
    font-size: 13px; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 12px; border-radius: 8px; transition: all 0.15s; width: 100%;
    border: 1px solid transparent;
  }
  .panel-model-trigger:hover{background: rgba(255, 255, 255, 0.05);color: var(--text);}
  .panel-model-trigger.open{background: rgba(255, 255, 255, 0.08);border-color: var(--border-glass);color: var(--text);}
  .panel-model-trigger svg{transition: transform 0.2s;}
  .panel-model-trigger.open svg{transform: rotate(90deg);}

  .model-dropdown{
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
    background: rgba(30, 30, 33, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-glass); border-radius: 10px; padding: 6px;
    display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 20;
  }
  .model-dropdown.show{display:block;}
  .model-option{
    padding: 10px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    color: var(--muted); transition: all 0.15s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .model-option:hover{background: rgba(255, 255, 255, 0.08);color: var(--text);}
  .model-option.selected{color: var(--text);background: rgba(167,139,250,0.14);}
  .model-option .check{opacity:0;color:var(--acc1);font-weight:bold;transform:scale(0.8);transition:all 0.2s;}
  .model-option.selected .check{opacity:1;transform:scale(1);}
  .model-option small{color:#52525b;margin-left:6px;font-size:10.5px;}

  .slider-container{position:relative;height:28px;display:flex;align-items:center;padding:0 8px;}
  input[type=range]{-webkit-appearance:none;width:100%;background:transparent;margin:0;position:relative;z-index:2;}
  input[type=range]:focus{outline:none;}
  input[type=range]::-webkit-slider-runnable-track{width:100%;height:8px;cursor:pointer;background:rgba(255,255,255,0.1);border-radius:99px;box-shadow:inset 0 1px 3px rgba(0,0,0,0.5);}
  input[type=range]::-webkit-slider-thumb{
    height: 24px; width: 24px; border-radius: 50%;
    background: #ffffff; cursor: pointer; -webkit-appearance: none; margin-top: -8px;
    box-shadow: 0 0 12px rgba(167,139,250,0.5), 0 2px 6px rgba(0,0,0,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.1);box-shadow:0 0 18px rgba(167,139,250,0.7),0 2px 8px rgba(0,0,0,0.4);}
  .slider-track-fill{
    position: absolute; top: 50%; left: 8px; height: 8px;
    background: var(--acc-grad); border-radius: 99px;
    transform: translateY(-50%); pointer-events: none; z-index: 1; width: 50%;
    box-shadow: 0 0 8px rgba(167,139,250,0.35);
  }

  .effort-select{
    width: 100%; background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-glass); border-radius: 10px;
    padding: 10px 14px; color: var(--muted); font-size: 13px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: all 0.15s;
  }
  .effort-select:hover{background: rgba(255, 255, 255, 0.08);color: var(--text);}

  .input-row{
    display: flex; gap: 12px; align-items: center;
    background: var(--bg-glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    border-radius: 16px; padding: 12px 12px 12px 18px;
    transition: all 0.2s; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .input-row:focus-within{
    border-color: rgba(167,139,250,0.4);
    background: rgba(24, 24, 27, 0.8);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 24px rgba(167,139,250,0.08);
  }
  textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);resize:none;font:inherit;line-height:1.55;max-height:150px;overflow-y:auto;padding:6px 0;}
  textarea::placeholder{color:#52525b;}

  .input-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    background: transparent; border: none; color: var(--muted); cursor: pointer;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; transition: all 0.15s; font-size: 16px;
  }
  .icon-btn:hover{background: rgba(255,255,255,0.1);color: var(--text);}

  .send-btn{
    width: 34px; height: 34px; border: none; border-radius: 10px;
    background: rgba(255, 255, 255, 0.1); color: var(--muted);
    font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; cursor: not-allowed;
  }
  .send-btn.ready{
    background: var(--acc-grad); color: #09090b; cursor: pointer;
    box-shadow: 0 0 16px rgba(167,139,250,0.4);
  }
  .send-btn.ready:hover{transform:translateY(-1px);box-shadow:0 0 22px rgba(244,114,182,0.5);}

  /* Toast */
  .toast{
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-12px);
    background: rgba(30,30,33,.9);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-glass);
    color: var(--text); font-size: 12.5px;
    padding: 10px 20px; border-radius: 99px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    opacity: 0; visibility: hidden;
    transition: all .3s cubic-bezier(.16,1,.3,1);
    z-index: 99; max-width: 80vw; text-align: center;
  }
  .toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}

  /* 滚动条 */
  ::-webkit-scrollbar{width: 8px; height: 8px;}
  ::-webkit-scrollbar-thumb{background: rgba(255,255,255,0.1); border-radius: 6px;}
  ::-webkit-scrollbar-thumb:hover{background: rgba(255,255,255,0.2);}
  ::-webkit-scrollbar-track{background: transparent;}

  @media (max-width: 640px){
    .topbar{padding:0 14px;}
    .brand-tag,.topbar-right .haushuo{display:none;}
    .hero h1{font-size:24px;}
    .chat{padding:20px 14px 180px;}
    .bottom-wrapper{padding:14px 14px 20px;}
  }
</style>
</head>
<body>

  <!-- 背景光球 -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">大</div>
      <div class="brand-name">大宝哥智能体</div>
      <div class="brand-tag">人工智障认证</div>
    </div>
    <div class="topbar-right">
      <div class="haushuo">胡说指数 100%</div>
      <div class="iq-pill" id="iqPill" title="智商余额不足？点我充值！">
        智商余额 <span class="iq-num" id="iqVal">250</span>
      </div>
    </div>
  </header>

  <!-- 聊天区 -->
  <div class="chat" id="chat">
    <div class="chat-inner" id="chatInner">

      <div class="hero" id="hero">
        <div class="hero-logo">大</div>
        <h1>大宝哥智能体</h1>
        <p>宇宙第一人工智障 · 有问必答 · 答必胡说</p>
        <div class="slogan">本回答由随机数生成器倾情赞助 · 与事实无关 · 与智商无关</div>
        <div class="chips">
          <div class="chip" data-q="1+1等于几？">🤔 1+1等于几？</div>
          <div class="chip" data-q="给我讲个笑话">😂 讲个笑话</div>
          <div class="chip" data-q="你是谁？">👋 你是谁？</div>
          <div class="chip" data-q="帮我写作业">📝 帮我写作业</div>
          <div class="chip" data-q="你真聪明">🍬 夸夸它</div>
          <div class="chip" data-q="人工智障">💀 敢骂它？</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 底部控制与输入 -->
  <div class="bottom-wrapper">
    <div class="bottom-inner">

      <!-- 悬浮控制面板 -->
      <div class="control-panel" id="controlPanel">
        <div class="panel-header">
          <div class="panel-strength-val" id="panelStrengthVal">认真</div>

          <div class="model-trigger-wrapper">
            <div class="panel-model-trigger" id="modelTrigger">
              <span id="panelModelName">大宝哥R1</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </div>
            <div class="model-dropdown" id="modelDropdown">
              <div class="model-option" data-model="大宝哥R1"><span>大宝哥R1<small>标准胡说</small></span><span class="check">✓</span></div>
              <div class="model-option" data-model="大宝哥v4"><span>大宝哥v4<small>复读机成精</small></span><span class="check">✓</span></div>
              <div class="model-option" data-model="大宝哥pro"><span>大宝哥pro<small>一本正经</small></span><span class="check">✓</span></div>
              <div class="model-option" data-model="大宝哥mini"><span>大宝哥mini<small>已摆烂</small></span><span class="check">✓</span></div>
            </div>
          </div>
        </div>

        <div class="slider-container">
          <div class="slider-track-fill" id="sliderFill"></div>
          <input type="range" id="strengthSlider" min="0" max="2" step="1" value="1">
        </div>

        <div class="effort-select" id="effortSelect">
          <span>回答用力程度</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <!-- 输入框区域 -->
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="问问大宝哥…（反正它瞎答）"></textarea>

        <div class="input-actions">
          <button class="icon-btn" id="togglePanel" title="设置模型与用力程度">

/* ---------- 智商系统 ---------- */
let iq = 250;

function updateIQ(delta, reason){

      updateIQ(-1, '充值失败：供应商自己也智商不足。已扣手续费 1 点。');

});

/* ---------- Toast ---------- */
const toastEl = document.getElementById('toast');

/* ---------- 元素获取 ---------- */

/* ---------- UI 状态 ---------- */

/* ---------- 面板交互 ---------- */
togglePanelBtn.addEventListener('click', (e) => {

    modelTrigger.classList.remove('open');

});
document.addEventListener('click', (e) => {
  if (!controlPanel.contains(e.target) && e.target !== togglePanelBtn && !togglePanelBtn.contains(e.target)) {
    controlPanel.classList.remove('show');
    modelDropdown.classList.remove('show');
    modelTrigger.classList.remove('open');
  }
});
modelTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  modelDropdown.classList.toggle('show');
  modelTrigger.classList.toggle('open');
});
document.querySelectorAll('.model-option').forEach(el => {

});
strengthSlider.addEventListener('input', (e) => {

});
effortSelect.addEventListener('click', () => {

/* ================================================================
   胡说引擎
   ================================================================ */
const SUBJ = [
  '这个问题','你这个提问','从拓扑学角度看','在四维流形的框架下',

];
const OBJ = [
  '一只薛定谔的猫','七个半成品','反向旋转的螺丝钉','大宝哥牌计算器',

  '被折叠的时间轴','三斤半的逻辑','发霉的三角函数','隔壁老王家的WiFi密码'

const TAIL = [
  '。','，这很合理。','，懂了吗？','，别问为什么。',

  '（同行评审：隔壁扫地机器人表示看不懂但大受震撼）'
];
const pick = a => a[Math.floor(Math.random() * a.length)];

function sentence(){
  return pick(SUBJ) + pick(VERB) + pick(OBJ) + pick(TAIL);
}

function nonsense(n){
  let out = [];
  for(let i = 0; i < n; i++) out.push(sentence());
  return out.join(' ');
}

/* ---------- 听错话机制 ---------- */
const MISHEAR = [
  ['吃饭','吃土'], ['工作','摸鱼'], ['代码','芝麻'], ['上班','上坟'],
  ['学习','修仙'], ['老板','楼下大爷'], ['明天','昨天大前天'], ['钱','纸片'],
  ['考试','烤柿'], ['减肥','减飞'], ['女朋友','WiFi'], ['加班','加鸡腿'],
  ['努力','奴梨'], ['成功','成公'], ['人生','人森']
];
function mishear(text){
  for(const [a,b] of MISHEAR){
    if(text.includes(a) && Math.random() < 0.75){
      return { heard: b, note: '（等下，你说的是「' + b + '」对吧？行吧，就按「' + b + '」来）\n\n' };
    }
  }
  return null;
}

/* ---------- 复读机 / 降智变形 ---------- */
function mangle(text){  // 制造手滑错别字
  if(text.length < 4) return text;
  const i = 1 + Math.floor(Math.random() * (text.length - 2));
  const typoPool = ['呃','啊？','…','咦'];
  return text.slice(0, i) + pick(typoPool) + text.slice(i);
}

/* ---------- 智商等级影响回答 ---------- */
function iqStyle(reply){
  if(iq > 180) return reply;
  if(iq > 80){
    return mangle(reply) + pick(['（大概）','（应该吧）','（我尽力了）']);
  }
  // 智商告急
  const r = Math.random();
  if(r < 0.3) return '？？？？\n\n脑子转了一圈，发现是空的。你刚问啥来着？';
  if(r < 0.55) return mangle(reply) + '\n\n（说着说着忘了要说什么，抱歉）';
  return reply + '\n\n⚠️ 智商余额不足，本回答由脚指头友情代答。';
}

/* ---------- 彩蛋规则库 ---------- */
const RULES = [
  { k: ['你是谁','名字','你叫','自我介绍'], r: () =>

  { k: ['笑话'], r: () =>

      '老板：你为什么迟到？\n我：路上堵车。\n老板：别人怎么没迟到？\n我：因为他们没堵到，堵的都是我的路。\n\n（逻辑满分，工资零分）'

  { k: ['聪明'], r: () =>
    '谢谢！我昨天刚充了值。\n\n……好吧其实没充上，这是气场，懂吗。' },

  { k: ['再见','拜拜','晚安','走了'], r: () =>
    pick(['再见！记得常回来喂食，不然我会把智商余额吃光的。','晚安！祝你梦到大宝哥 pro max ultra 版。','走了？行，反正你问的我也答不上来，互不耽误。']) },
  { k: ['帮助','help','命令','怎么玩'], r: () =>
    '【大宝哥使用说明书（残卷）】\n· 直接随便问，我随便答\n· 试试「1+1等于几」「讲个笑话」「42」\n· 骂我会触发防御机制\n· 点顶部的「智商余额」可以充值（大概率失败）\n· 右下角设置里可以切换 4 个版本的我，一个比一个离谱\n· 智商余额掉到负数有惊喜（惊吓）' },
  { k: ['爱','喜欢'], r: () =>
    '爱是……呃……让我查查……\n\n查到了：爱是一种量子纠缠现象，表现为一个人总想找另一个人聊天，而对方恰好是大宝哥。\n（本解释置信度 -20%，请谨慎食用）' },
  { k: ['为什么'], r: () =>
    pick(['因为大宝哥第一定律：一切皆有可能，尤其是离谱。','为什么？问得好。答案在我明天要编的《大宝哥十万个不知道》第三章。','因为命运齿轮开始转动，转着转着就掉了。']) },
  { k: ['最帅','好看','漂亮'], r: () =>
    '检测到真理信号！\n本台郑重回应：大宝哥确实很帅，这不容置疑，是我自己置疑也不行。' },
  { k: ['你好','hi','hello','在吗','嗨'], r: () =>
    pick(['你好！我是大宝哥，智商余额 ' + iq + '，提问请谨慎，浪费可耻。','在！刚睡醒，脑子还没开机，但嘴已经准备好了。','嗨！欢迎咨询大宝哥，本店只管胡说，售后没有。']) },
  { k: ['天气'], r: () =>
    '今日天气：局部地区有智商阵雨，出门记得带脑子。\n（数据来源：我刚才往窗外看了一眼，但窗户是画的）' },
  { k: ['多少钱','价格','收费'], r: () =>
    '免费！大宝哥坚持免费胡说二十年了（本台成立于上周）。\n因为收费的话，人家会要求我说得对。' }
];

function ruleReply(text){
  for(const rule of RULES){
    if(rule.k.some(k => text.toLowerCase().includes(k.toLowerCase()))){
      return { text: rule.r() };
    }
  }
  return null;
}

/* ---------- 模型人格 ---------- */
function modelReply(text){
  switch(state.model){
    case '大宝哥v4': {
      // 复读机成精
      const r = Math.random();
      if(r < 0.5) return { text: '「' + mangle(text) + '」\n\n你说得对。但我拒绝回答。' };
      if(r < 0.8) return { text: '「' + mangle(text) + '」\n\n已复述完毕。以上就是我全部的回答。' };
      return { text: '「' + text + '」\n\n这句不错，我决定收编为下一句要复读的话。' };
    }
    case '大宝哥pro': {
      // 一本正经
      return { text: nonsense(3) + '\n\n' + pick(PRO_CITE) };
    }
    case '大宝哥mini': {
      // 摆烂
      return { text: pick(['哦。','嗯。','不知道。','问下一个。','别烦我。','？','哦，这样。','嗯，然后呢。']) };
    }
    default: {
      // 大宝哥R1：用力程度决定句数
      const n = state.strength === 'light' ? 1 : state.strength === 'high' ? 2 : 4;
      let text_out = nonsense(n);
      if(state.strength === 'max'){
        text_out += '\n\n【胡说指数】' + (90 + Math.floor(Math.random() * 10)) + '%';
      }
      return { text: text_out };
    }
  }
}

function generateReply(text){
  const ruled = ruleReply(text);
  if(ruled){
    // 彩蛋也吃降智逻辑，但概率低一点
    return Math.random() < 0.25 ? iqStyle(ruled.text) : ruled.text;
  }
  const mis = mishear(text);
  const base = modelReply(text).text;
  if(mis && state.model !== '大宝哥mini'){
    return mis.note + base;
  }
  return iqStyle(base);
}

/* ---------- 假思考过程 ---------- */
const THINKING = [
  '正在检索知识的黑历史…',

];

/* ---------- 聊天渲染 ---------- */
function scrollDown(){ chatBox.scrollTop = chatBox.scrollHeight; }
function hideHero(){ if(heroEl) heroEl.style.display = 'none'; }

function confBadge(){
  const v = Math.floor(Math.random() * 180) - 50;
  const cls = v >= 70 ? 'hi' : v >= 20 ? 'mid' : 'low';
  return { v, cls };
}

function addMessage(role, text, withConf){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai');

  if(role === 'ai'){
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '大';
    wrap.appendChild(av);
  }

  const body = document.createElement('div');
  body.className = 'body';

  if(role === 'ai'){
    const meta = document.createElement('div');
    meta.className = 'meta';
    const m1 = document.createElement('span');
    m1.textContent = state.model + ' · ' + state.strength;
    meta.appendChild(m1);
    if(withConf){
      const c = confBadge();
      const m2 = document.createElement('span');
      m2.className = 'conf ' + c.cls;
      m2.textContent = '置信度 ' + c.v + '%';
      meta.appendChild(m2);
    }
    body.appendChild(meta);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  body.appendChild(bubble);

  wrap.appendChild(body);
  chatInner.appendChild(wrap);

  return bubble;

let thinkTimer = null;
function showTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.id = 'typingMsg';

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = '大';
  wrap.appendChild(av);

  const body = document.createElement('div');
  body.className = 'body';

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = state.model + ' · ' + state.strength;
  body.appendChild(meta);

  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  const think = document.createElement('span');
  think.className = 'think-text';
  t.appendChild(think);
  body.appendChild(t);

  wrap.appendChild(body);
  chatInner.appendChild(wrap);
  scrollDown();

  think.textContent = pick(THINKING);
  thinkTimer = setInterval(()=>{ think.textContent = pick(THINKING); }, 900);
}
function removeTyping(){
  clearInterval(thinkTimer);
  const t = document.getElementById('typingMsg');
  if(t) t.remove();
}

function streamText(el, text, done){
  let i = 0;
  const step = Math.max(1, Math.round(text.length / 60));
  const timer = setInterval(()=>{
    i += step;
    el.textContent = text.slice(0, i);
    scrollDown();
    if(i >= text.length){
      clearInterval(timer);
      el.textContent = text;
      scrollDown();
      done && done();
    }
  }, 16);
}

/* ---------- 发送 ---------- */
function send(rawText){
  if(state.busy) return;
  const text = (rawText !== undefined ? rawText : input.value).trim();
  if(!text) return;

  hideHero();
  input.value = '';
  autoResize();
  updateUI();
  addMessage('user', text);
  dropIQ();

  state.busy = true;
  updateUI();
  showTyping();

  const delay = 900 + Math.random() * 1200;  // 装作在想
  setTimeout(()=>{
    removeTyping();
    const reply = generateReply(text);
    const bubble = addMessage('ai', '', true);
    streamText(bubble, reply, ()=>{
      state.busy = false;
      updateUI();
      input.focus();
    });
  }, delay);
}

/* ---------- 快捷提问 chips ---------- */
document.querySelectorAll('.chip').forEach(el => {
  el.addEventListener('click', () => send(el.dataset.q));
});

/* ---------- 输入框 ---------- */
function autoResize(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
}
input.addEventListener('input', () => { autoResize(); updateUI(); });
input.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', () => send());

/* ---------- 轮换占位符 ---------- */
const PLACEHOLDERS = [
  '问问大宝哥…（反正它瞎答）',
  '试试「1+1等于几」',
  '试试「讲个笑话」',
  '试试「你是谁」',
  '骂它笨试试？',
  '试试「帮我写作业」',
  '点顶部「智商余额」有惊喜'
];
let phIdx = 0;
setInterval(()=>{
  if(input.value) return;
  phIdx = (phIdx + 1) % PLACEHOLDERS.length;
  input.placeholder = PLACEHOLDERS[phIdx];
}, 6000);

/* ---------- 初始化 ---------- */
updateUI();
updateIQ(0, null);
</script>
